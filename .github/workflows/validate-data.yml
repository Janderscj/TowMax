name: Validate data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Confirm Node is working
        run: node -v
